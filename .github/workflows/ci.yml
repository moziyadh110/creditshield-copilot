name: CI

# Every push: lint and tests. Every pull request: also the eval on recorded LLM responses
# (no API key) through the release gate, and the Docker Compose stack. Manual trigger: the live
# eval, which records fresh responses for the candidate prompt.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Run the live eval (DeepSeek, ~$0.11) and record responses"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  UV_VERSION: "0.11.6"

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Database and Reg B index
        run: |
          uv run alembic upgrade head
          uv run python -m app.retrieval.ingest
      - run: uv run pytest

  eval-recorded:
    name: Eval on recorded responses + release gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-retries 10
    env:
      # A throwaway MLflow store: prompts registered from the repo, so v<n>.yaml is version n.
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Database, Reg B index and prompt registry
        run: |
          uv run alembic upgrade head
          uv run python -m app.retrieval.ingest
          uv run python -m app.llmops.prompts
      - name: Replay the candidate's recorded runs (fails with "re-record needed" if none)
        run: uv run python -m evals.runner --prompt candidate --mode e2e --llm recorded
      - name: Release gate, check only (same targets.yaml and code as promotion)
        run: uv run python -m app.llmops.gate check candidate --recorded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-recorded-results
          path: evals/results/recorded/

  compose:
    name: Docker Compose stack
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start db, MLflow, setup and the API (no LLM key)
        run: |
          echo "API_KEY=ci-only" > .env
          mkdir -m 777 mlartifacts
          docker compose up -d --wait --wait-timeout 600
      - name: Health, auth and a MANUAL_REVIEW case (202, no LLM call)
        run: |
          curl -fsS localhost:8001/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8001/notices             -H 'Content-Type: application/json' -d '{"applicant_id": 100227}')" = 401
          code=$(curl -s -o out.json -w '%{http_code}' -X POST localhost:8001/notices \
            -H 'X-API-Key: ci-only' -H 'Content-Type: application/json' \
            -d '{"applicant_id": 100227}')
          cat out.json
          test "$code" = 202
      - if: failure()
        run: docker compose logs

  eval-live:
    name: Live eval (records responses)
    if: github.event_name == 'workflow_dispatch' && inputs.live_eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-retries 10
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Database, Reg B index and prompt registry
        run: |
          uv run alembic upgrade head
          uv run python -m app.retrieval.ingest
          uv run python -m app.llmops.prompts
      - name: Three live runs per mode
        run: for i in 1 2 3; do uv run python -m evals.runner --prompt candidate --mode both; done
      - run: uv run python -m app.llmops.gate check candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-recordings-and-results
          path: |
            evals/recorded/
            evals/results/
