[project]
name = "creditshield-copilot"
version = "0.1.0"
description = "Plain-language adverse action notices for CreditShield denials, with rule-based guardrails."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.31",
    "en-core-web-sm",
    "fastapi>=0.162",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langgraph>=1.2.18",
    "mlflow>=3.15,<3.16",
    "openai>=3.39.0",
    "pandas>=2.2",
    "pgvector>=0.5.1",
    "presidio-analyzer>=2.2.365",
    "presidio-anonymizer>=2.2.364",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=18",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "streamlit>=1.66.1",
    "textstat>=0.7.13",
    "torch>=2.14",
    "uvicorn>=0.54",
]

[project.scripts]
copilot = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the installed package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# CPU-only PyTorch on Linux (the Docker image and CI): the default Linux wheels pull in
# several GB of CUDA libraries the embedding model never uses. Windows wheels are CPU-only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
